        building_block_09:
          children:
            file_node:
              hosts:
                beegfs_17:
                beegfs_18:
            block_node:
              hosts:
                netapp_17:
                netapp_18:

        beegfs_services:
          children:
            meta:
              children:
                building_block_07:
            stor:
              children:
